function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ===================== Lógica (portada de src/lib) ===================== */
function bloquesDeHoy(horario, fecha) {
  if (!horario || !horario.bloques) return [];
  const hoy = diaISO(fecha);
  return horario.bloques.filter((b) => (b.dias || []).includes(hoy) && b.inicio && b.fin)
    .sort((a, b) => hhmmAMinutos(a.inicio) - hhmmAMinutos(b.inicio));
}
function tramoParaFichada(bloques, tipo, min) {
  let mejor = null, dist = Infinity;
  for (const b of bloques) { const ref = hhmmAMinutos(tipo === "entrada" ? b.inicio : b.fin); const d = Math.abs(min - ref); if (d < dist) { dist = d; mejor = b; } }
  return mejor;
}
function calcularEstado(tipo, hora, horario) {
  const bloques = bloquesDeHoy(horario, hora);
  if (!bloques.length) return { estado: "sin_turno", label: "Sin turno hoy (franco o sin asignar)", minutosTarde: 0 };
  const tol = horario.tolerancia_minutos ?? 10;
  const min = hora.getHours() * 60 + hora.getMinutes();
  const bloque = tramoParaFichada(bloques, tipo, min);
  if (tipo === "entrada") {
    const ini = hhmmAMinutos(bloque.inicio);
    if (min <= ini + tol) return { estado: "a_horario", label: "A horario", minutosTarde: 0 };
    return { estado: "tarde", label: `Tarde · +${min - ini} min`, minutosTarde: min - ini };
  }
  const fin = hhmmAMinutos(bloque.fin);
  if (min < fin - tol) return { estado: "salida_anticipada", label: `Salida anticipada · -${fin - min} min`, minutosTarde: fin - min };
  return { estado: "a_horario", label: "A horario", minutosTarde: 0 };
}
function calcularPeriodo(ref) {
  const y = ref.getFullYear(), m = ref.getMonth();
  return { desde: new Date(y, m, 1, 0, 0, 0, 0), hasta: new Date(y, m + 1, 0, 23, 59, 59, 999) };
}
const etiquetaPeriodo = (desde) => desde.toLocaleDateString("es-AR", { month: "long", year: "numeric" });

function hhmmR(x) { if (x === "24:00" || x === "24") return 1440; const [h, m] = String(x).split(":").map(Number); return h * 60 + (m || 0); }
function tasaEn(t, feriados, recargos) {
  const fk = fechaKey(t);
  if (feriados && feriados[fk] != null) return feriados[fk];
  const iso = diaISO(t), minDia = t.getHours() * 60 + t.getMinutes();
  let best = 0;
  for (const r of recargos) { if (!(r.dias || []).includes(iso)) continue; if (minDia >= hhmmR(r.hora_desde) && minDia < hhmmR(r.hora_hasta)) best = Math.max(best, r.porcentaje); }
  return best;
}
function minutosRecargo(s, e, config) {
  let min50 = 0, min100 = 0;
  let t = new Date(s.getFullYear(), s.getMonth(), s.getDate(), s.getHours(), s.getMinutes());
  const end = e.getTime(); let guard = 0;
  while (t.getTime() < end && guard++ < 100000) {
    const r = tasaEn(t, config.feriados, config.recargos);
    if (r >= 100) min100++; else if (r >= 50) min50++;
    t = new Date(t.getTime() + 60000);
  }
  return { min50, min100 };
}
const minAHoras = (min) => { const t = Math.round(min); return `${Math.floor(t / 60)}h ${t % 60}m`; };
const formatHoras = (ms) => { const t = Math.round(ms / 60000); return `${Math.floor(t / 60)} h ${t % 60} m`; };

function computarCumplimiento(fichajes, horario, desde, hasta, config) {
  const res = { sinTurno: !horario || !horario.bloques || !horario.bloques.length, diasEsperados: 0, diasTrabajados: 0, sinRegistro: 0, sinEntrada: 0, sinSalida: 0, minTarde: 0, minRetiro: 0, descuentoMin: 0, horas50Min: 0, horas100Min: 0, trabajadoMin: 0 };
  fichajes.forEach((f) => {
    if (f.autorizado) return;
    if (f.estado === "tarde") res.minTarde += Number(f.minutos_tarde) || 0;
    else if (f.estado === "salida_anticipada") res.minRetiro += Number(f.minutos_tarde) || 0;
  });
  res.descuentoMin = res.minTarde + res.minRetiro;
  const orden = fichajes.slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  let pend = null;
  orden.forEach((f) => {
    if (f.tipo === "entrada") pend = new Date(f.timestamp);
    else if (f.tipo === "salida" && pend) {
      const { min50, min100 } = minutosRecargo(pend, new Date(f.timestamp), config);
      res.horas50Min += min50; res.horas100Min += min100;
      res.trabajadoMin += (new Date(f.timestamp) - pend) / 60000; pend = null;
    }
  });
  if (!res.sinTurno) {
    const dias = new Set(); horario.bloques.forEach((b) => (b.dias || []).forEach((d) => dias.add(d)));
    const porFecha = {};
    fichajes.forEach((f) => { const k = fechaKey(new Date(f.timestamp)); const r = (porFecha[k] = porFecha[k] || { entrada: false, salida: false }); if (f.tipo === "entrada") r.entrada = true; if (f.tipo === "salida") r.salida = true; });
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const cur = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate());
    const fin = new Date(hasta.getFullYear(), hasta.getMonth(), hasta.getDate());
    while (cur <= fin) {
      if (cur <= hoy && dias.has(diaISO(cur))) {
        res.diasEsperados++;
        const reg = porFecha[fechaKey(cur)];
        if (!reg) res.sinRegistro++;
        else { if (reg.entrada && reg.salida) res.diasTrabajados++; if (!reg.entrada) res.sinEntrada++; if (!reg.salida) res.sinSalida++; }
      }
      cur.setDate(cur.getDate() + 1);
    }
  }
  return res;
}
function textoIncumplimientos(eq, desde) {
  const lineas = [];
  eq.forEach((m) => {
    const c = m.cumpl, p = [];
    if (c.sinRegistro > 0) p.push(`${c.sinRegistro} día(s) sin registro`);
    if (c.sinEntrada > 0) p.push(`${c.sinEntrada} sin entrada`);
    if (c.sinSalida > 0) p.push(`${c.sinSalida} sin salida`);
    if (c.minTarde > 0) p.push(`${c.minTarde} min tarde`);
    if (c.minRetiro > 0) p.push(`${c.minRetiro} min retiro`);
    if (p.length) lineas.push(`• ${m.apellido}, ${m.nombre}: ${p.join(", ")} (descuento ${c.descuentoMin} min)`);
  });
  if (!lineas.length) return `Período ${etiquetaPeriodo(desde)} — sin incumplimientos detectados.`;
  return `Período ${etiquetaPeriodo(desde)} — incumplimientos:\n` + lineas.join("\n");
}
function computarDashboard(fichajes, empleados) {
  const activos = {}; empleados.forEach((e) => { if (e.activo !== false) activos[e.legajo] = e; });
  const byEmp = {}; fichajes.forEach((f) => { if (!activos[f.legajo]) return; (byEmp[f.legajo] = byEmp[f.legajo] || []).push(f); });
  let totalTrabajadoMs = 0, totalMinTarde = 0, totalMinTemprano = 0, totalTarde = 0, totalEntradas = 0, totalAHorario = 0, totalSalidaAnt = 0;
  const sectorTarde = {}, porEmp = {};
  Object.keys(byEmp).forEach((legajo) => {
    const arr = byEmp[legajo].slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    const e = activos[legajo];
    let tarde = 0, minTarde = 0, minTemprano = 0, salidaAnt = 0, entradas = 0, trabajadoMs = 0, pend = null;
    arr.forEach((f) => {
      if (f.tipo === "entrada") {
        entradas++;
        if (f.estado === "tarde") { tarde++; if (!f.autorizado) minTarde += Number(f.minutos_tarde) || 0; }
        else if (f.estado === "a_horario") totalAHorario++;
        pend = new Date(f.timestamp);
      } else if (f.tipo === "salida") {
        if (f.estado === "salida_anticipada") { salidaAnt++; if (!f.autorizado) minTemprano += Number(f.minutos_tarde) || 0; }
        if (pend) { trabajadoMs += new Date(f.timestamp) - pend; pend = null; }
      }
    });
    const minDesvio = minTarde + minTemprano;
    porEmp[legajo] = { legajo: Number(legajo), nombre: e.nombre, apellido: e.apellido, sector: e.sector || "—", tarde, minTarde, minTemprano, minDesvio, salidaAnt, entradas, trabajadoMs };
    totalTrabajadoMs += trabajadoMs; totalMinTarde += minTarde; totalMinTemprano += minTemprano;
    totalTarde += tarde; totalEntradas += entradas; totalSalidaAnt += salidaAnt;
    if (tarde > 0) sectorTarde[e.sector || "—"] = (sectorTarde[e.sector || "—"] || 0) + tarde;
  });
  const lista = Object.values(porEmp);
  const masTarde = lista.filter((x) => x.tarde > 0).sort((a, b) => b.tarde - a.tarde || b.minDesvio - a.minDesvio || a.apellido.localeCompare(b.apellido)).slice(0, 20);
  const menosTarde = lista.filter((x) => x.entradas > 0).sort((a, b) => a.tarde - b.tarde || a.minDesvio - b.minDesvio || a.apellido.localeCompare(b.apellido)).slice(0, 20);
  let sectorTop = null; Object.entries(sectorTarde).forEach(([s, n]) => { if (!sectorTop || n > sectorTop.n) sectorTop = { sector: s, n }; });
  return { totalTrabajadoMs, totalMinTarde, totalMinTemprano, totalMinDesvio: totalMinTarde + totalMinTemprano, totalTarde, totalEntradas,
    puntualidad: totalEntradas ? (totalAHorario / totalEntradas) * 100 : 0, totalSalidaAnt,
    empleadosActivos: Object.keys(activos).length, empleadosTotal: empleados.length, sectorTop, masTarde, menosTarde };
}

  const inicio = new Date(ahora.getFullYear(), ahora.getMonth() - (G.mesesHistoria - 1), 1);
  DATA.empleados.forEach((e) => {
    const r = mulberry32(G.semilla * 1000 + e.legajo);
    const h = DATA.horarios.find((x) => x.id === e.horario_id) || null;
    const loc = () => (r() < G.probRemoto ? null : (e.locales_asignados[0] || "d1"));
    const push = (tipo, ts, hor) => {
      let est = hor ? calcularEstado(tipo, ts, hor) : { estado: "sin_turno", minutosTarde: 0 };
      const l = loc();
      DATA.fichajes.push({ id: nextId++, legajo: e.legajo, tipo, timestamp: ts.toISOString(), estado: est.estado, minutos_tarde: est.minutosTarde || 0,
        local_id: l, distancia_metros: l ? 10 + Math.floor(r() * 110) : 900 + Math.floor(r() * 4000), autorizado: false });
    };
    // Días pasados
    for (let d = new Date(inicio); d < hoy0; d = sumarDias(d, 1)) {
      let bloques = bloquesDeHoy(h, d);
      if (!h) bloques = diaISO(d) <= 5 ? [{ inicio: "08:00", fin: "16:00" }] : []; // sin turno asignado, igual ficha
      if (!bloques.length || r() < G.probAusente) continue;
      const tol = h ? (h.tolerancia_minutos ?? 10) : 10;
      bloques.forEach((b) => {
        const tarde = r() < e.tardanza;
        const offE = tarde ? tol + 1 + Math.floor(r() * 38) : Math.floor(r() * (tol + 12)) - 12;
        const te = new Date(d); te.setHours(0, hhmmAMinutos(b.inicio) + offE, Math.floor(r() * 60), 0);
        push("entrada", te, h);
        if (r() < G.probOlvidoSalida) return;
        const ant = r() < G.probSalidaAnticipada;
        const offS = ant ? -(tol + 1 + Math.floor(r() * 55)) : Math.floor(r() * 22);
        const ts = new Date(d); ts.setHours(0, hhmmAMinutos(b.fin) + offS, Math.floor(r() * 60), 0);
        push("salida", ts, h);
      });
    }
    // Hoy: presentes ahora mismo (para "En vivo")
    if (e.activo && e.legajo !== DEMO_DATA.usuarioDemo && r() < G.presentesHoy) {
      const minDesdeCero = (ahora - hoy0) / 60000;
      let hace = 15 + Math.floor(r() * 420);
      if (hace > minDesdeCero - 5) hace = Math.floor(minDesdeCero * (0.3 + r() * 0.6));
      if (hace >= 3) {
        const te = new Date(ahora.getTime() - hace * 60000);
        const tarde = r() < e.tardanza;
        const l = e.locales_asignados[0] || "d1";
        DATA.fichajes.push({ id: nextId++, legajo: e.legajo, tipo: "entrada", timestamp: te.toISOString(), estado: tarde ? "tarde" : "a_horario",
          minutos_tarde: tarde ? 11 + Math.floor(r() * 30) : 0, local_id: l, distancia_metros: 10 + Math.floor(r() * 100), autorizado: false });
      }
    }
  });
  DATA.fichajes.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  // Ausencias
  DEMO_DATA.ausencias.forEach((a, i) => {
    const d = sumarDias(hoy0, a.desde), h = sumarDias(hoy0, a.desde + a.dias - 1);
    DATA.ausencias.push({ id: i + 1, legajo: a.legajo, tipo: a.tipo, fecha_desde: fechaKey(d), fecha_hasta: fechaKey(h), motivo: a.motivo || "", estado: a.estado, resolucion: a.resolucion || "", creado: DEMO_DATA.ausencias.length - i });
  });
})();

function generarReporte(tipo) {
  const r = S.a.rep;
  r.error = null; r.ok = null;
  if (r.alcance === "empleado" && !r.legajo) { r.error = "Elegí un empleado."; return render(); }
  if (r.alcance === "sector" && !r.sector) { r.error = "Elegí un sector."; return render(); }
  r.bajando = tipo; render();
  setTimeout(() => {
    const { desde, hasta } = calcularPeriodo(r.refMes);
    let headers, rows, nombre;
    if (tipo === "detalle") {
      let filas = fichajesEn(desde, hasta, r.alcance === "empleado" ? Number(r.legajo) : null).filter((f) => (empPorLegajo(f.legajo) || {}).activo !== false);
      if (r.alcance === "sector") filas = filas.filter((f) => (empPorLegajo(f.legajo) || {}).sector === r.sector);
      if (!filas.length) { r.bajando = ""; r.error = "No hay fichadas para ese filtro."; return render(); }
      headers = ["Legajo", "Apellido y Nombre", "Sector", "Fecha", "Hora", "Día", "Tipo", "Estado", "Ubicación", "Distancia (m)"];
      rows = filas.map((f) => { const e = empPorLegajo(f.legajo) || {}, d = new Date(f.timestamp);
        return [f.legajo, `${e.apellido}, ${e.nombre}`, e.sector || "", d.toLocaleDateString("es-AR"), hora(d), d.toLocaleDateString("es-AR", { weekday: "long" }), f.tipo, f.estado,
          f.local_id ? (localDe(f.local_id) || {}).nombre : "Remoto", f.distancia_metros == null ? "" : f.distancia_metros.toLocaleString("es-AR")]; });
      nombre = `fichadas_${fechaKey(desde)}_a_${fechaKey(hasta)}.xlsx`;
      r.ok = `Reporte generado: ${rows.length.toLocaleString("es-AR")} fichadas.`;
    } else {
      let lista = DATA.empleados.filter((e) => e.activo !== false);
      if (r.alcance === "sector") lista = lista.filter((e) => e.sector === r.sector);
      if (r.alcance === "empleado") lista = lista.filter((e) => String(e.legajo) === String(r.legajo));
      lista.sort((x, y) => x.apellido.localeCompare(y.apellido));
      if (!lista.length) { r.bajando = ""; r.error = "No hay empleados para ese filtro."; return render(); }
      headers = ["Legajo", "Empleado", "Sector", "Días esperados", "Días trabajados", "Sin registro", "Sin entrada", "Sin salida", "Horas trabajadas", "Min. tarde", "Min. retiro", "Descuento (min)", "Horas 50%", "Horas 100%"];
      const n1 = (x) => (Math.round(x / 6) / 10).toLocaleString("es-AR");
      rows = lista.map((e) => { const c = computarCumplimiento(fichajesEn(desde, hasta, e.legajo), horarioDe(e), desde, hasta, DATA.config);
        return [e.legajo, `${e.apellido}, ${e.nombre}`, e.sector || "", c.sinTurno ? "" : c.diasEsperados, c.sinTurno ? "" : c.diasTrabajados, c.sinTurno ? "" : c.sinRegistro,
          c.sinTurno ? "" : c.sinEntrada, c.sinTurno ? "" : c.sinSalida, n1(c.trabajadoMin), c.minTarde, c.minRetiro, c.descuentoMin, n1(c.horas50Min), n1(c.horas100Min)]; });
      nombre = `resumen_${fechaKey(desde)}_a_${fechaKey(hasta)}.xlsx`;
      r.ok = `Resumen generado: ${rows.length} empleados.`;
    }
    r.bajando = ""; render();
    const max = 15;
    abrirModal(`<div class="px-5 py-4 border-b border-[#e3e8ed] flex items-center justify-between gap-3">
        <div class="min-w-0"><p class="text-sm font-bold truncate">📄 ${nombre}</p><p class="text-[11px] text-[#94a1ab]">Vista previa · ${rows.length.toLocaleString("es-AR")} filas</p></div>
        <button data-a="cerrarModal" class="text-[#94a1ab] hover:text-[#1f2d38] text-xl leading-none" aria-label="Cerrar">×</button></div>
      <div class="overflow-auto max-h-[50vh]"><table class="text-[11px] w-full border-collapse">
        <thead class="sticky top-0 bg-[#223c7e] text-white"><tr>${headers.map((h) => `<th class="px-2 py-1.5 text-left font-semibold whitespace-nowrap">${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.slice(0, max).map((row, i) => `<tr class="${i % 2 ? "bg-[#f1f4f7]" : "bg-white"}">${row.map((c) => `<td class="px-2 py-1 whitespace-nowrap">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      ${rows.length > max ? `<p class="px-5 pt-2 text-[11px] text-[#94a1ab]">… y ${(rows.length - max).toLocaleString("es-AR")} filas más.</p>` : ""}
      <div class="px-5 py-4"><div class="rounded-xl p-3 text-xs border" style="background-color:rgba(43,169,224,.1);border-color:rgba(43,169,224,.4);color:#1f6f96">🔒 En la demo el archivo Excel no se descarga. En la app real se genera el .xlsx con todas las filas.</div></div>`);
  }, 700);
}

/* ===================== Render ===================== */
function render() {
  $("#sw-empleado").style.cssText = S.modo === "empleado" ? "background:#e1251b;color:#fff" : "color:#5c6b78";
  $("#sw-admin").style.cssText = S.modo === "admin" ? "background:#e1251b;color:#fff" : "color:#5c6b78";
  let html;
  if (S.modo === "empleado") {
    const v = S.e.vista;
    html = !S.e.logueado ? vLoginEmpleado() : v === "historial" ? vHistorial() : v === "equipo" ? vEquipo() : v === "ausencias" ? vAusenciasEmp() : vFichaje();
  } else html = S.a.logueado ? vAdmin() : vLoginAdmin();
  $("#app").innerHTML = html;
  const act = document.querySelector('[data-a="tab"][data-activo]');
  if (act && act.parentElement.scrollWidth > act.parentElement.clientWidth) act.parentElement.scrollLeft = act.offsetLeft - 8;
}

function simularUbicacion() {
  S.e.ubicCargando = true; render();
  setTimeout(() => {
    S.e.ubic = { tipo: "dentro", local: localDe("d1"), distancia: 20 + Math.floor(Math.random() * 70) };
    S.e.ubicCargando = false;
    if (S.modo === "empleado" && S.e.vista === "fichaje") render();
  }, 900);
}

function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }

/* ===================== Acciones ===================== */
const ACC = {
  modo(el) { S.modo = el.dataset.v; render(); if (S.modo === "empleado" && S.e.vista === "fichaje" && !S.e.ubic) simularUbicacion(); window.scrollTo(0, 0); },
  // Empleado
  loginEmp() { S.e.logueado = true; S.e.vista = "fichaje"; simularUbicacion(); },
  salirEmp() { S.e.logueado = false; S.e.modoPin = false; S.e.pinMsg = null; render(); },
  modoPin(el) { S.e.modoPin = el.dataset.v === "1"; S.e.pinMsg = null; render(); },
  guardarPinLogin() { S.e.pinMsg = "¡PIN actualizado! Ya podés ingresar con el nuevo. (demo)"; render(); },
  vistaEmp(el) {
    const v = el.dataset.v; S.e.vista = v; S.e.resultado = null; S.e.modoObservar = false;
    if (el.dataset.tab) S.e.ausTab = el.dataset.tab;
    if (v === "ausencias") S.e.ausMsg = null;
    if (v === "fichaje") simularUbicacion(); else render();
    window.scrollTo(0, 0);
  },
  ubicar() { simularUbicacion(); toast("📍 Ubicación simulada. " + AVISO); },
  fichar() {
    if (S.e.guardando) return;
    const tipo = S.e.enTurno ? "salida" : "entrada";
    S.e.guardando = true; S.e.msg = null; S.e.ubicCargando = true; render();
    setTimeout(() => {
      const ahora = new Date(), emp = empDemo();
      let est = calcularEstado(tipo, ahora, horarioDe(emp));
      if (est.estado === "sin_turno" || est.minutosTarde > 90) est = { estado: "a_horario", label: "A horario", minutosTarde: 0 };
      const dist = 20 + Math.floor(Math.random() * 70);
      S.e.ubic = { tipo: "dentro", local: localDe("d1"), distancia: dist }; S.e.ubicCargando = false;
      DATA.fichajes.push({ id: nextId++, legajo: emp.legajo, tipo, timestamp: ahora.toISOString(), estado: est.estado, minutos_tarde: est.minutosTarde || 0, local_id: "d1", distancia_metros: dist, autorizado: false });
      S.e.historial.unshift({ tipo, hora: ahora, estado: est.estado });
      S.e.enTurno = !S.e.enTurno; S.e.guardando = false;
      S.e.msg = { ok: true, texto: `${tipo === "entrada" ? "Entrada" : "Salida"} registrada · ${est.label}` };
      render();
      toast(`✅ Fichada guardada en memoria${tipo === "entrada" ? " — ya aparece en <b>Panel RR.HH. › En vivo</b>" : ""}. La ubicación GPS es simulada. ${AVISO}`);
    }, 900);
  },
  mesHist(el) { S.e.refHist = mover(S.e.refHist, +el.dataset.d); render(); },
  mesEq(el) { S.e.refEq = mover(S.e.refEq, +el.dataset.d); S.e.expandido = null; S.e.resultado = null; S.e.modoObservar = false; S.e.motivo = ""; render(); },
  expandir(el) { const l = +el.dataset.leg; S.e.expandido = S.e.expandido === l ? null : l; render(); },
  justificar(el) { const f = DATA.fichajes.find((x) => x.id === +el.dataset.id); if (f) f.autorizado = el.dataset.v === "1"; render(); },
  aprobar() {
    S.e.enviando = true; render();
    setTimeout(() => {
      S.e.enviando = false; S.e.verif[keyMes(S.e.refEq)] = { estado: "aprobado" };
      S.e.resultado = { ok: true, texto: `Período aprobado. Aviso por mail a RR.HH. simulado (${esc(DEMO_DATA.empresa.emailAdmin)}).` };
      render(); toast("✉️ Período aprobado. " + AVISO);
    }, 900);
  },
  observarModo() { const { desde } = calcularPeriodo(S.e.refEq); S.e.modoObservar = true; S.e.resultado = null; if (!S.e.motivo) S.e.motivo = textoIncumplimientos(equipoCumpl(), desde); render(); },
  observarVolver() { S.e.modoObservar = false; render(); },
  observar() {
    const t = ($("#motivoObs") || {}).value || "";
    S.e.motivo = t;
    if (!t.trim()) { S.e.resultado = { ok: false, texto: "Escribí el motivo de la observación." }; return render(); }
    S.e.enviando = true; render();
    setTimeout(() => {
      S.e.enviando = false; S.e.modoObservar = false;
      S.e.verif[keyMes(S.e.refEq)] = { estado: "observado", motivo: t.trim() };
      S.e.resultado = { ok: true, texto: "Observación enviada al admin para revisión. (Demo: el mail no se envía)" };
      render(); toast("✉️ Observación registrada. " + AVISO);
    }, 900);
  },
  ausTab(el) { S.e.ausTab = el.dataset.v; render(); },
  pedirAusencia() {
    const f = S.e.ausForm;
    if (!f.desde) { S.e.ausMsg = { ok: false, t: "Elegí la fecha desde." }; return render(); }
    DATA.ausencias.push({ id: DATA.ausencias.length + 1, legajo: DEMO_DATA.usuarioDemo, tipo: f.tipo, fecha_desde: f.desde, fecha_hasta: f.hasta && f.hasta >= f.desde ? f.hasta : f.desde,
      motivo: f.motivo.trim(), estado: "pendiente", resolucion: "", creado: Date.now() });
    S.e.ausForm = { tipo: "dia_libre", desde: "", hasta: "", motivo: "" };
    S.e.ausMsg = { ok: true, t: "Solicitud enviada. Tu jefe la va a revisar." };
    render(); toast("📅 Solicitud creada en memoria (también aparece en Panel RR.HH. › Ausencias). " + AVISO);
  },
  aprobarAus(el) { const s = DATA.ausencias.find((x) => x.id === +el.dataset.id); if (s) { s.estado = "aprobada"; render(); toast(`✓ Ausencia de ${esc(nombreDe(s.legajo))} aprobada.`); } },
  rechazarAus(el) {
    const s = DATA.ausencias.find((x) => x.id === +el.dataset.id); if (!s) return;
    abrirModal(`<div class="p-5"><p class="text-sm font-bold mb-1">Rechazar solicitud</p>
      <p class="text-xs text-[#5c6b78] mb-3">${esc(nombreDe(s.legajo))} · ${TIPOS[s.tipo]} · ${rango(s)}</p>
      <label class="text-[10px] uppercase tracking-widest text-[#94a1ab]">Motivo del rechazo (opcional)</label>
      <textarea id="motivoRech" rows="3" class="w-full mt-1 bg-[#f1f4f7] border border-[#cfd6dd] rounded-lg px-3 py-2 text-sm outline-none resize-none"></textarea>
      <div class="flex gap-2 mt-3"><button data-a="cerrarModal" class="flex-1 py-2.5 rounded-xl font-semibold text-xs bg-[#f1f4f7] border border-[#cfd6dd] text-[#5c6b78]">Cancelar</button>
        <button data-a="confirmarRechazo" data-id="${s.id}" class="flex-1 py-2.5 rounded-xl font-bold text-xs bg-[#e5484d] text-white">Rechazar</button></div></div>`);
    setTimeout(() => { const t = $("#motivoRech"); if (t) t.focus(); }, 30);
  },
  confirmarRechazo(el) {
    const s = DATA.ausencias.find((x) => x.id === +el.dataset.id);
    if (s) { s.estado = "rechazada"; s.resolucion = (($("#motivoRech") || {}).value || "").trim(); }
    cerrarModal(); render(); if (s) toast(`Solicitud de ${esc(nombreDe(s.legajo))} rechazada.`);
  },
  cerrarModal() { cerrarModal(); },
  cerrarModalFondo(el, ev) { if (ev.target === el) cerrarModal(); },
  // Admin
  loginAdmin() { S.a.logueado = true; render(); },
  salirAdmin() { S.a.logueado = false; render(); },
  tab(el) { S.a.vista = el.dataset.v; if (S.a.vista === "presentismo") S.a.actualizado = new Date(); render(); },
  mesDash(el) { S.a.refMes = mover(S.a.refMes, +el.dataset.d); render(); },
  actualizarVivo() { S.a.actualizado = new Date(); render(); toast("↻ Presentismo actualizado."); },
  toggleNuevo() { S.a.mostrarNuevo = !S.a.mostrarNuevo; render(); },
  crearEmpleado() {
    const n = S.a.nuevo, legajo = parseInt(n.legajo, 10);
    if (!legajo) return toast("Poné un número de legajo.");
    if (DATA.empleados.some((e) => e.legajo === legajo)) return toast("Ya existe un empleado con ese legajo.");
    if (!n.apellido.trim() || !n.nombre.trim()) return toast("Completá apellido y nombre.");
    if (!n.pin || n.pin.length < 4) return toast("El PIN debe tener al menos 4 dígitos.");
    DATA.empleados.push({ legajo, apellido: n.apellido.trim(), nombre: n.nombre.trim(), sector: n.sector || null, horario_id: n.horario_id || null,
      responsable_legajo: n.responsable_legajo ? parseInt(n.responsable_legajo, 10) : null, locales_asignados: n.locales.filter(Boolean).filter((v, i, a) => a.indexOf(v) === i), activo: true, tardanza: 0 });
    S.a.nuevo = { legajo: "", apellido: "", nombre: "", sector: "", horario_id: "", responsable_legajo: "", locales: ["", "", ""], pin: "1234" };
    S.a.mostrarNuevo = false; S.a.busqueda = String(legajo); render();
    toast(`✓ Empleado ${legajo} creado en memoria. Se pierde al recargar.`);
  },
  toggleActivo(el) { const e = empPorLegajo(el.dataset.leg); e.activo = !(e.activo !== false); refrescarLista(); },
  editarPin(el) { S.a.pinEdit = +el.dataset.leg; refrescarLista(); setTimeout(() => { const i = $("#pinNuevo"); if (i) i.focus(); }, 20); },
  cancelarPin() { S.a.pinEdit = null; refrescarLista(); },
  guardarPin(el) {
    const v = ($("#pinNuevo") || {}).value || "";
    if (v.length < 4) return toast("El PIN debe tener al menos 4 dígitos.");
    const l = +el.dataset.leg; S.a.pinEdit = null; S.a.pinOk = l; refrescarLista();
    setTimeout(() => { if (S.a.pinOk === l) { S.a.pinOk = null; if (S.a.vista === "empleados") refrescarLista(); } }, 1800);
  },
  ausFiltro(el) { S.a.ausFiltro = el.dataset.v; render(); },
  alcance(el) { S.a.rep.alcance = el.dataset.v; S.a.rep.error = null; S.a.rep.ok = null; render(); },
  mesRep(el) { S.a.rep.refMes = mover(S.a.rep.refMes, +el.dataset.d); S.a.rep.ok = null; S.a.rep.error = null; render(); },
  repDetalle() { generarReporte("detalle"); },
  repResumen() { generarReporte("resumen"); },
};

function refrescarLista() { const c = $("#emp-lista"); if (c) c.innerHTML = listaEmpleadosHTML(); }

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = ACC[el.dataset.a];
  if (fn) fn(el, ev);
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.in) return;
  const p = el.dataset.in;
  if (p === "busqueda") { S.a.busqueda = el.value; refrescarLista(); return; }
  if (p.startsWith("nuevo.")) return setPath(S.a, p, el.value);
  if (p.startsWith("ausForm.")) return setPath(S.e, p, el.value);
  if (p.startsWith("rep.")) { setPath(S.a, p, el.value); S.a.rep.error = null; }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.in && el.dataset.in.startsWith("rep.")) { setPath(S.a, el.dataset.in, el.value); S.a.rep.error = null; S.a.rep.ok = null; return render(); }
  if (!el.dataset || !el.dataset.campo) return;
  const e = empPorLegajo(el.dataset.leg), campo = el.dataset.campo;
  if (campo === "locales") {
    const prev = e.locales_asignados || [], tres = [prev[0] || "", prev[1] || "", prev[2] || ""];
    tres[+el.dataset.i] = el.value; e.locales_asignados = tres.filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
  } else if (campo === "responsable_legajo") e.responsable_legajo = el.value === "" ? null : parseInt(el.value, 10);
  else e[campo] = el.value || null;
  S.a.guardado = e.legajo; refrescarLista();
  setTimeout(() => { if (S.a.guardado === e.legajo) { S.a.guardado = null; if (S.a.vista === "empleados") refrescarLista(); } }, 1400);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") cerrarModal();
  if (ev.key === "Enter" && ev.target.id === "pinNuevo") { const b = ev.target.parentElement.querySelector('[data-a="guardarPin"]'); if (b) b.click(); }
});

// Reloj y duraciones en vivo
setInterval(() => {
  const r = $("#reloj"); if (r) r.textContent = horaSeg(new Date());
  document.querySelectorAll("[data-dur-turno]").forEach((x) => (x.textContent = durTurno()));
  document.querySelectorAll("[data-desde]").forEach((x) => (x.textContent = durDesde(new Date(+x.dataset.desde))));
}, 1000);

render();
simularUbicacion();
</script>
</body>
</html>
